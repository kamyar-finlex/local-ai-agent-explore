# squid's client ACL, included by egress-proxy.conf.
#
# squid listens on 0.0.0.0, so without this line every container that can reach
# port 3128 gets a free open proxy -- on a developer machine that is a dozen
# unrelated dev containers, plus anything on the egress-side network.
#
# The subnet must match `networks.isolated.ipam.config.subnet` in
# docker-compose.yml. It is pinned there precisely so this file can be committed
# rather than generated at setup time; verify-egress.sh asserts the two agree,
# because a stale subnet here silently turns the allow into a deny-everything or
# -- worse, if the subnet is later reused -- into an open proxy.
acl agent_net src 172.31.0.0/24
