# squid as the single egress hole for a confined orchestrator.
#
# The model gate (ollama-gate.conf) filters by URL PATH. That works only because
# the model API is plaintext HTTP. It does not transfer to HTTPS: the request
# line the agent sends to a proxy is "CONNECT api.linear.app:443", and the path
# lives inside TLS. So the allowlist here is by DOMAIN, and the proxy stays a
# blind tunnel -- no TLS interception, no CA to install, no plaintext of the
# agent's traffic anywhere.
#
# Everything below is default-deny. Each `http_access deny` above the allow is a
# named bypass being closed, in evaluation order.

http_port 3128

# Only the isolated network may use this proxy. Generated by setup-egress.sh
# from the network's real subnet -- squid listens on 0.0.0.0, so without this
# any container on the default bridge would find an open proxy.
include /etc/squid/agent-net.conf

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

# An IP literal skips DNS, so it never matches a dstdomain rule. Deny it
# explicitly rather than relying on the default: `CONNECT 1.1.1.1:443` is the
# obvious way to sidestep a domain allowlist and it deserves its own line.
acl ip_literal dstdom_regex ^([0-9]{1,3}\.){3}[0-9]{1,3}$
acl ip_literal dstdom_regex ^\[?[0-9a-fA-F]{0,4}(:[0-9a-fA-F]{0,4})+\]?$

http_access deny !agent_net       # not an open proxy for the rest of the host
http_access deny ip_literal       # no DNS-free CONNECT
http_access deny !CONNECT         # tunnel only: squid must never fetch a URL itself
http_access deny CONNECT !SSL_ports  # 443 only -- no :22 (ssh), no :27017 (mongo)
http_access allow allowed_domains
http_access deny all

# The proxy resolves the names, because the agent's network has no outbound DNS.
# That is deliberate: DNS never leaves the agent's network, so it cannot be a
# covert channel and the agent cannot resolve what it may not reach.
#
# No caching: nothing to cache in a CONNECT tunnel, and no state to poison.
cache deny all
cache_mem 8 MB
pid_filename /var/run/squid.pid

# One line per attempt, allowed or denied -- `docker logs` becomes an independent
# record of everything the agent tried to reach. The files are on a tmpfs that
# the image tails onto stdout; squid runs unprivileged and cannot write to
# Docker's own root-owned stdout pipe.
logfile_rotate 0
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
httpd_suppress_version_string on
via off
forwarded_for delete
