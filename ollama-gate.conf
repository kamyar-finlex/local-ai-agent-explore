# Rate-limit zones. Ollama runs on the HOST, outside the container's cgroup, so
# the agent's --memory/--cpus limits do not cap inference cost. Throttle here.
limit_conn_zone $binary_remote_addr zone=ollama_conn:1m;
limit_req_zone  $binary_remote_addr zone=ollama_req:1m rate=180r/m;

server {
    listen 11434;

    # Ollama rejects unknown Host headers with 403; it allowlists
    # host.docker.internal but not "ollama-gate", so present that name.
    proxy_set_header Host host.docker.internal:11434;
    proxy_http_version 1.1;

    # Token streaming must not be buffered or cut off mid-generation.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # 6 concurrent generations (enough for delegation fan-out), 3 req/s
    # sustained with burst. A runaway agent loop gets 429, not your whole GPU.
    limit_conn ollama_conn 6;
    limit_req  zone=ollama_req burst=30 nodelay;
    limit_conn_status 429;
    limit_req_status 429;

    # Cap request bodies — no reason for an inference call to be huge, and it
    # stops the agent using the gate as a bulk transfer channel.
    client_max_body_size 8m;

    # ---- DENIED: model-store administration -------------------------------
    # /api/pull makes the HOST fetch from registry.ollama.ai — an indirect
    # internet egress for an otherwise offline container, and a disk-filler.
    # /api/push is an exfiltration channel. create/copy/delete/blobs mutate
    # the host's model store. None are needed to run inference.
    location ~ ^/api/(pull|push|create|copy|delete|blobs) {
        return 403;
    }

    # ---- ALLOWED: inference ----------------------------------------------
    location /v1/ {
        proxy_pass http://host.docker.internal:11434;
    }
    location = /api/chat {
        proxy_pass http://host.docker.internal:11434;
    }
    location = /api/generate {
        proxy_pass http://host.docker.internal:11434;
    }
    location = /api/embed {
        proxy_pass http://host.docker.internal:11434;
    }
    location = /api/embeddings {
        proxy_pass http://host.docker.internal:11434;
    }

    # ---- ALLOWED: read-only introspection --------------------------------
    location = /api/tags {
        proxy_pass http://host.docker.internal:11434;
    }
    location = /api/ps {
        proxy_pass http://host.docker.internal:11434;
    }
    location = /api/show {
        proxy_pass http://host.docker.internal:11434;
    }
    location = /api/version {
        proxy_pass http://host.docker.internal:11434;
    }

    # ---- Default deny -----------------------------------------------------
    location / {
        return 403;
    }
}
